# render.yaml
services:
  - type: web
    name: license-plate-recognition
    env: python
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr libgl1-mesa-glx libglib2.0-0
      pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --timeout 120 --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: FLASK_ENV
        value: production
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    autoDeploy: true